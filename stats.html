<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Números · Watercats!</title>
  <meta name="description" content="A temporada do clube Watercats: rating, Premier, vitórias e mira.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=53" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=53">
  <link rel="canonical" href="https://watercats.vercel.app/stats">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/stats">
  <meta property="og:title" content="Números · Watercats!">
  <meta property="og:description" content="A temporada do clube Watercats: rating, Premier, vitórias e mira.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=53">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Números · Watercats!">
  <meta name="twitter:description" content="A temporada do clube Watercats: rating, Premier, vitórias e mira.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=53">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=63">
</head>
<body>
  <header class="header" id="header"></header>
  <div class="pulse" id="pulse"></div>
  <main class="wrap section season-page">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="stats.kicker"></p>
        <h2 data-i18n="nav.stats"></h2>
        <p data-i18n="stats.sub"></p>
      </div>
    </div>
    <div id="board"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=63"></script>
  <script>
    function render() {
      const board = document.getElementById("board");
      Promise.all([
        WTC.api("/api/players"),
        WTC.api("/api/clips").catch(() => ({ clips: [] }))
      ]).then(([{ players }, { clips }]) => {
        const pulse = document.getElementById("pulse");
        if (pulse) pulse.innerHTML = WTC.pulseLine(players);

        if (!players.length) {
          board.innerHTML = WTC.emptyBox("empty.stats");
          WTC.motion();
          return;
        }

        const { ordered, lead, hot, sheets } = WTC.seasonBoard(players);
        let lastSync = null;
        const rows = ordered.map(({ p, s, ink }, i) => {
          if (p.leetify && p.leetify.syncedAt && (!lastSync || p.leetify.syncedAt > lastSync)) {
            lastSync = p.leetify.syncedAt;
          }
          return `<tr class="is-${i + 1}" style="--player:${WTC.escapeAttr(ink)}">
            <th scope="row">
              <div class="board-who">
                <span class="board-rank">${String(i + 1).padStart(2, "0")}</span>
                ${WTC.whoCell(p)}
                ${WTC.formBadges(p)}
              </div>
            </th>
            ${WTC.boardCell(WTC.dash(s.rating, 2), WTC.isBest(s.rating, lead.rating))}
            ${WTC.boardCell(WTC.dash(s.premier), WTC.isBest(s.premier, lead.premier))}
            ${WTC.boardCell(s.winrate == null ? "—" : WTC.pct(s.winrate), WTC.isBest(s.winrate, lead.winrate))}
            ${WTC.boardCell(WTC.dash(s.matches), WTC.isBest(s.matches, lead.matches))}
            ${WTC.boardCell(WTC.dash(s.aim, 1), WTC.isBest(s.aim, lead.aim))}
            ${WTC.boardCell(WTC.dash(s.positioning, 1), WTC.isBest(s.positioning, lead.positioning))}
            ${WTC.boardCell(WTC.dash(s.utility, 1), WTC.isBest(s.utility, lead.utility))}
            ${WTC.boardCell(s.hsAccuracy == null ? "—" : WTC.dash(s.hsAccuracy, 1) + "%", WTC.isBest(s.hsAccuracy, lead.hsAccuracy))}
            ${WTC.boardCell(s.reactionMs == null ? "—" : WTC.dash(s.reactionMs), WTC.isBest(s.reactionMs, lead.reactionMs))}
          </tr>`;
        }).join("");

        const note = lastSync
          ? `<p class="source">${WTC.t("lf.sub")} ${WTC.t("lf.synced")} ${new Date(lastSync).toLocaleDateString()}.</p>`
          : `<p class="source">${WTC.t("lf.empty")}</p>`;
        board.innerHTML = `
          <div class="grid stats-grid home-stats house-stats">${WTC.houseCards(players, clips)}</div>
          <section class="season-hot">
            <div class="section-head">
              <div>
                <p class="kicker">${WTC.t("home.now")}</p>
                <h2>${WTC.t("home.hot")}</h2>
                <p>${WTC.t("home.hot.sub")}</p>
              </div>
            </div>
            <div class="hot-grid">${hot}</div>
          </section>
          <div class="season-board">${sheets}</div>
          <div class="table-wrap season-table"><table>
            <thead><tr>
              <th>${WTC.t("th.player")}</th><th>${WTC.t("lf.rating")}</th><th>${WTC.t("lf.premier")}</th>
              <th>${WTC.t("lf.winrate")}</th><th>${WTC.t("lf.matches")}</th><th>${WTC.t("lf.aim")}</th>
              <th>${WTC.t("lf.positioning")}</th><th>${WTC.t("lf.utility")}</th><th>${WTC.t("lf.hs")}</th>
              <th>${WTC.t("lf.reaction")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>${note}`;
        WTC.motion();
      }).catch(() => { board.innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
