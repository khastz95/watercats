<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estatísticas · Watercats</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=30" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=30">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="stats.kicker"></p>
        <h2 data-i18n="nav.stats"></h2>
        <p data-i18n="stats.sub"></p>
      </div>
    </div>
    <div id="board"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=30"></script>
  <script>
    function render() {
      const board = document.getElementById("board");
      Promise.all([
        WTC.api("/api/players"),
        WTC.api("/api/clips").catch(() => ({ clips: [] }))
      ]).then(([{ players }, { clips }]) => {
        let lastSync = null;
        // Maior rating primeiro; quem não tem número vai para o fim.
        const ordered = players
          .map((p) => ({ p, s: WTC.stats(p) }))
          .sort((a, b) => (b.s.rating ?? -Infinity) - (a.s.rating ?? -Infinity));

        const rows = ordered.map(({ p, s }) => {
          if (p.leetify && p.leetify.syncedAt && (!lastSync || p.leetify.syncedAt > lastSync)) {
            lastSync = p.leetify.syncedAt;
          }
          return `<tr>
            <th scope="row">${WTC.whoCell(p)}</th>
            <td>${WTC.dash(s.rating, 2)}</td>
            <td>${WTC.dash(s.premier)}</td>
            <td>${WTC.pct(s.winrate)}</td>
            <td>${WTC.dash(s.matches)}</td>
            <td>${WTC.dash(s.aim, 1)}</td>
            <td>${WTC.dash(s.positioning, 1)}</td>
            <td>${WTC.dash(s.utility, 1)}</td>
            <td>${s.hsAccuracy == null ? "—" : WTC.dash(s.hsAccuracy, 1) + "%"}</td>
            <td>${s.reactionMs == null ? "—" : WTC.dash(s.reactionMs)}</td>
          </tr>`;
        }).join("");

        if (!players.length) {
          board.innerHTML = WTC.emptyBox("empty.stats");
          return;
        }
        const note = lastSync
          ? `<p class="source">${WTC.t("lf.sub")} ${WTC.t("lf.synced")} ${new Date(lastSync).toLocaleDateString()}.</p>`
          : `<p class="source">${WTC.t("lf.empty")}</p>`;
        board.innerHTML = `
          <div class="grid stats-grid home-stats house-stats">${WTC.houseCards(players, clips)}</div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th>${WTC.t("th.player")}</th><th>${WTC.t("lf.rating")}</th><th>${WTC.t("lf.premier")}</th>
              <th>${WTC.t("lf.winrate")}</th><th>${WTC.t("lf.matches")}</th><th>${WTC.t("lf.aim")}</th>
              <th>${WTC.t("lf.positioning")}</th><th>${WTC.t("lf.utility")}</th><th>${WTC.t("lf.hs")}</th>
              <th>${WTC.t("lf.reaction")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>${note}`;
        WTC.motion();
      }).catch(() => { board.innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
