<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estatísticas · WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/logo.png?v=9" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=9">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="nav.stats"></p>
        <h2 data-i18n="nav.stats"></h2>
        <p data-i18n="stats.sub"></p>
      </div>
    </div>
    <div id="board"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=9"></script>
  <script>
    function render() {
      WTC.api("/api/players").then(({ players }) => {
        const rows = players.map((p) => {
          const s = p.stats || {};
          return `<tr>
            <td><a href="/jogador/${p.id}">${p.name}</a></td>
            <td>${p.role || "—"}</td>
            <td>${WTC.dash(s.rating, 2)}</td>
            <td>${WTC.dash(s.kd, 2)}</td>
            <td>${WTC.dash(s.adr, 1)}</td>
            <td>${WTC.dash(s.hsPercent, 1)}</td>
            <td>${WTC.dash(s.mapsPlayed)}</td>
            <td>${WTC.dash(s.wins)}/${WTC.dash(s.losses)}</td>
            <td>${WTC.dash(s.kills)}</td>
            <td>${WTC.dash(s.clutches)}</td>
          </tr>`;
        }).join("");
        document.getElementById("board").innerHTML = players.length ? `
          <div class="table-wrap"><table>
            <thead><tr>
              <th>${WTC.t("th.player")}</th><th>${WTC.t("th.role")}</th><th>${WTC.t("th.rating")}</th>
              <th>${WTC.t("th.kd")}</th><th>${WTC.t("th.adr")}</th><th>${WTC.t("th.hs")}</th>
              <th>${WTC.t("th.maps")}</th><th>${WTC.t("th.wl")}</th><th>${WTC.t("th.kills")}</th>
              <th>${WTC.t("th.clutches")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>` : WTC.emptyBox("empty.stats");
      }).catch(() => { document.getElementById("board").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
