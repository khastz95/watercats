<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estatísticas · WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=12" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=12">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="stats.kicker"></p>
        <h2 data-i18n="nav.stats"></h2>
        <p data-i18n="stats.sub"></p>
      </div>
    </div>
    <div id="board"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=12"></script>
  <script>
    function render() {
      const board = document.getElementById("board");
      WTC.api("/api/players").then(({ players }) => {
        let anyCsrep = false;
        let lastSync = null;
        const rows = players.map((p) => {
          const s = WTC.effectiveStats(p);
          if (WTC.fromCsrep(s)) anyCsrep = true;
          if (p.csrep && p.csrep.syncedAt && (!lastSync || p.csrep.syncedAt > lastSync)) {
            lastSync = p.csrep.syncedAt;
          }
          const cell = (entry, digits = 0) =>
            `<td${entry.csrep ? ' class="is-csrep"' : ""}>${WTC.dash(entry.value, digits)}</td>`;
          return `<tr>
            <th scope="row"><a href="/jogador/${encodeURIComponent(p.id)}">${WTC.escapeHtml(p.name)}</a></th>
            <td>${WTC.escapeHtml(p.role) || "—"}</td>
            ${cell(s.rating, 2)}
            ${cell(s.kd, 2)}
            ${cell(s.adr, 1)}
            ${cell(s.hsPercent, 1)}
            ${cell(s.mapsPlayed)}
            <td>${WTC.dash(s.wins.value)}/${WTC.dash(s.losses.value)}</td>
            ${cell(s.kills)}
            ${cell(s.clutches)}
          </tr>`;
        }).join("");

        if (!players.length) {
          board.innerHTML = WTC.emptyBox("empty.stats");
          return;
        }
        const note = anyCsrep
          ? `<p class="source">${WTC.t("csrep.sub")}${lastSync ? ` ${WTC.t("csrep.synced")} ${new Date(lastSync).toLocaleDateString()}.` : ""}</p>`
          : "";
        board.innerHTML = `
          <div class="table-wrap"><table>
            <thead><tr>
              <th>${WTC.t("th.player")}</th><th>${WTC.t("th.role")}</th><th>${WTC.t("th.rating")}</th>
              <th>${WTC.t("th.kd")}</th><th>${WTC.t("th.adr")}</th><th>${WTC.t("th.hs")}</th>
              <th>${WTC.t("th.maps")}</th><th>${WTC.t("th.wl")}</th><th>${WTC.t("th.kills")}</th>
              <th>${WTC.t("th.clutches")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>${note}`;
      }).catch(() => { board.innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
