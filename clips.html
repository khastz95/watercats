<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogadas · Watercats! - Alliance</title>
  <meta name="description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=107" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=107">
  <link rel="canonical" href="https://watercats.vercel.app/clips">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/clips">
  <meta property="og:title" content="Jogadas · Watercats!">
  <meta property="og:description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=107">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jogadas · Watercats!">
  <meta name="twitter:description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=107">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=107">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="clips-page">
    <section class="wrap clips-hero">
      <p class="kicker" data-i18n="clips.kicker"></p>
      <h1 data-i18n="clips.title"></h1>
      <p class="tagline"><span>ALLIANCE</span></p>
      <p class="clips-lede" data-i18n="clips.sub"></p>
      <ul class="about-chips" aria-label="Arquivo">
        <li data-i18n="clips.chip1"></li>
        <li data-i18n="clips.chip2"></li>
        <li data-i18n="clips.chip3"></li>
      </ul>
      <div class="actions">
        <a class="btn" href="#arquivo" data-i18n="clips.browse"></a>
        <a class="btn btn-ghost" href="/players" data-i18n="cta.players"></a>
        <a class="btn btn-ghost" href="/stats" data-i18n="nav.stats"></a>
      </div>
    </section>

    <section class="wrap section clips-stage" id="arquivo">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">01</span> <span data-i18n="clips.stage"></span></p>
          <h2 data-i18n="clips.stageTitle"></h2>
          <p data-i18n="clips.stageSub"></p>
        </div>
        <p class="clips-count" id="count"></p>
      </div>
      <div class="facts clips-facts" id="facts"></div>
      <div class="clips-toolbar">
        <p class="clips-toolbar-lab" data-i18n="clips.filter"></p>
        <div id="filters" class="clip-filters"></div>
      </div>
      <div id="list" class="grid clips"></div>
    </section>

    <section class="wrap section about-close">
      <div class="about-close-card">
        <p class="kicker" data-i18n="clips.close.kicker"></p>
        <h2 data-i18n="clips.close.title"></h2>
        <p data-i18n="clips.close.lede"></p>
        <div class="actions">
          <a class="btn" href="/stats" data-i18n="nav.stats"></a>
          <a class="btn btn-ghost" href="/join" data-i18n="nav.join"></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=107"></script>
  <script>
    function countLabel(shown, total) {
      return WTC.t("clips.count")
        .replace("{n}", String(shown))
        .replace("{total}", String(total));
    }

    function render() {
      Promise.all([WTC.api("/api/clips"), WTC.api("/api/players")])
        .then(([{ clips }, { players }]) => {
          const list = document.getElementById("list");
          const filters = document.getElementById("filters");
          const facts = document.getElementById("facts");
          const count = document.getElementById("count");
          if (facts) facts.innerHTML = WTC.factStrip(players, clips);
          const ids = players.map((p) => p.id).filter((id) => clips.some((c) => c.playerId === id));
          filters.innerHTML = `<button type="button" class="chip is-on" data-f="">${WTC.t("clips.all")}</button>` +
            ids.map((id) => {
              const p = players.find((x) => x.id === id);
              const name = (p && p.name) || id;
              return `<button type="button" class="chip" data-f="${WTC.escapeAttr(id)}" style="--player:${WTC.escapeAttr(WTC.cardInk(p || id))}">${WTC.playerMark(p || id, "is-chip")}${WTC.escapeHtml(name)}</button>`;
            }).join("");
          let filter = "";
          let shown = 12;
          function rows() {
            return filter ? clips.filter((c) => c.playerId === filter) : clips;
          }
          function paint() {
            const all = rows();
            list.innerHTML = WTC.clipPager(all, shown);
            if (count) count.textContent = countLabel(Math.min(shown, all.length), all.length);
            WTC.motion();
          }
          paint();
          filters.onclick = (e) => {
            const btn = e.target.closest("[data-f]");
            if (!btn) return;
            filters.querySelectorAll(".chip").forEach((x) => x.classList.toggle("is-on", x === btn));
            filter = btn.dataset.f;
            shown = 12;
            paint();
          };
          list.onclick = (e) => {
            const more = e.target.closest("[data-clip-more]");
            if (!more) return;
            shown += 12;
            paint();
          };
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
