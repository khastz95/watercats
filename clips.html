<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogadas · Watercats!</title>
  <meta name="description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=53" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=53">
  <link rel="canonical" href="https://watercats.vercel.app/clips">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/clips">
  <meta property="og:title" content="Jogadas · Watercats!">
  <meta property="og:description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=53">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jogadas · Watercats!">
  <meta name="twitter:description" content="Jogadas gravadas pelos membros do clube Watercats.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=53">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=70">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="clips.kicker"></p>
        <h2 data-i18n="clips.title"></h2>
        <p data-i18n="clips.sub"></p>
      </div>
    </div>
    <div class="facts" id="facts"></div>
    <div id="filters" class="clip-filters"></div>
    <div id="list" class="grid clips"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=70"></script>
  <script>
    function render() {
      Promise.all([WTC.api("/api/clips"), WTC.api("/api/players")])
        .then(([{ clips }, { players }]) => {
          const list = document.getElementById("list");
          const filters = document.getElementById("filters");
          const facts = document.getElementById("facts");
          if (facts) facts.innerHTML = WTC.factStrip(players, clips);
          const ids = players.map((p) => p.id).filter((id) => clips.some((c) => c.playerId === id));
          filters.innerHTML = `<button type="button" class="chip is-on" data-f="">${WTC.t("clips.all")}</button>` +
            ids.map((id) => {
              const name = players.find((p) => p.id === id)?.name || id;
              return `<button type="button" class="chip" data-f="${WTC.escapeAttr(id)}">${WTC.escapeHtml(name)}</button>`;
            }).join("");
          let filter = "";
          let shown = 12;
          function rows() {
            return filter ? clips.filter((c) => c.playerId === filter) : clips;
          }
          function paint() {
            list.innerHTML = WTC.clipPager(rows(), shown);
            WTC.motion();
          }
          paint();
          filters.onclick = (e) => {
            const btn = e.target.closest("[data-f]");
            if (!btn) return;
            filters.querySelectorAll(".chip").forEach((x) => x.classList.toggle("is-on", x === btn));
            filter = btn.dataset.f;
            shown = 12;
            paint();
          };
          list.onclick = (e) => {
            const more = e.target.closest("[data-clip-more]");
            if (!more) return;
            shown += 12;
            paint();
          };
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
