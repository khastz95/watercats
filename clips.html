<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogadas · Watercats</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=28" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=28">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="clips.kicker"></p>
        <h2 data-i18n="clips.title"></h2>
        <p data-i18n="clips.sub"></p>
      </div>
    </div>
    <div class="facts" id="facts"></div>
    <div id="filters" class="clip-filters"></div>
    <div id="list" class="grid clips"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=28"></script>
  <script>
    function render() {
      Promise.all([WTC.api("/api/clips"), WTC.api("/api/players")])
        .then(([{ clips }, { players }]) => {
          const list = document.getElementById("list");
          const filters = document.getElementById("filters");
          const facts = document.getElementById("facts");
          if (facts) facts.innerHTML = WTC.factStrip(players, clips);
          const ids = players.map((p) => p.id).filter((id) => clips.some((c) => c.playerId === id));
          filters.innerHTML = `<button type="button" class="chip is-on" data-f="">${WTC.t("clips.all")}</button>` +
            ids.map((id) => {
              const name = players.find((p) => p.id === id)?.name || id;
              return `<button type="button" class="chip" data-f="${WTC.escapeAttr(id)}">${WTC.escapeHtml(name)}</button>`;
            }).join("");
          function show(id) {
            const rows = id ? clips.filter((c) => c.playerId === id) : clips;
            list.innerHTML = rows.length
              ? rows.map((c, i) => WTC.clipCard(c, { featured: i === 0 })).join("")
              : WTC.emptyBox("empty.clips");
            WTC.motion();
          }
          show("");
          filters.onclick = (e) => {
            const btn = e.target.closest("[data-f]");
            if (!btn) return;
            filters.querySelectorAll(".chip").forEach((x) => x.classList.toggle("is-on", x === btn));
            show(btn.dataset.f);
          };
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
