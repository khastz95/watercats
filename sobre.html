<head>

  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=53" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=53">
  <link rel="canonical" href="https://watercats.vercel.app/sobre">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/sobre">
  <meta property="og:title" content="O clube · Watercats!">
  <meta property="og:description" content="Watercats é um clube de amigos. O nome existe há gerações; hoje o jogo é CS2.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=53">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">

  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=55">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap">
    <section class="about-hero">
      <p class="kicker" data-i18n="about.kicker"></p>
      <h1 data-i18n="about.title"></h1>
      <p class="tagline">OLD FRIENDS. <span>SAME GAMES.</span></p>
      <div class="about-copy">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <p data-i18n="about.p3"></p>
        <p data-i18n="about.p4"></p>
        <p data-i18n="about.p5"></p>
        <p data-i18n="about.p6"></p>
      </div>
      <div class="actions">
        <a class="btn" href="/players" data-i18n="cta.players"></a>
        <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
        <a class="btn btn-ghost" href="/stats" data-i18n="nav.stats"></a>
      </div>
    </section>
    <section class="section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="about.crew"></p>
          <h2 data-i18n="about.crew"></h2>
        </div>
        <a href="/players" data-i18n="cta.players"></a>
      </div>
      <div id="roster"></div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=55"></script>
  <script>
    function render() {
      WTC.api("/api/players")
        .then(({ players }) => {
          document.getElementById("roster").innerHTML = players.length
            ? WTC.starRoster(players)
            : WTC.emptyBox("empty.players");
          WTC.motion();
        })
        .catch(() => { document.getElementById("roster").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
