<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=13" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=13">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap login">
    <form class="card" id="form">
      <h1 data-i18n="login.title"></h1>
      <p data-i18n="login.body"></p>
      <div class="field">
        <label for="password" data-i18n="login.password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" data-i18n="login.submit"></button>
      <p class="msg" id="msg"></p>
    </form>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=13"></script>
  <script>
    if (sessionStorage.getItem(WTC.TOKEN_KEY)) location.replace("/admin");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      try {
        const data = await WTC.api("/api/auth", {
          method: "POST",
          body: { password: document.getElementById("password").value }
        });
        sessionStorage.setItem(WTC.TOKEN_KEY, data.token);
        location.replace("/admin");
      } catch (err) {
        msg.textContent = err.message || "Senha inválida";
      }
    });
  </script>
</body>
</html>
