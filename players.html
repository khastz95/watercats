<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membros · Watercats! - Alliance</title>
  <meta name="description" content="Quem faz parte do clube Watercats hoje. Perfis, números e jogadas.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=71" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=71">
  <link rel="canonical" href="https://watercats.vercel.app/players">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/players">
  <meta property="og:title" content="Membros · Watercats!">
  <meta property="og:description" content="Quem faz parte do clube Watercats hoje. Perfis, números e jogadas.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Membros · Watercats!">
  <meta name="twitter:description" content="Quem faz parte do clube Watercats hoje. Perfis, números e jogadas.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=89">
</head>
<body class="is-players">
  <header class="header" id="header"></header>
  <main class="players-page">
    <section class="wrap players-hero">
      <div class="players-hero-grid">
        <div class="players-hero-copy">
          <p class="kicker" data-i18n="players.kicker"></p>
          <h1 data-i18n="nav.players"></h1>
          <p class="tagline"><span>ALLIANCE</span></p>
          <p class="players-lede" data-i18n="players.sub"></p>
          <ul class="about-chips" aria-label="Membros">
            <li data-i18n="players.chip1"></li>
            <li data-i18n="players.chip2"></li>
            <li data-i18n="players.chip3"></li>
          </ul>
          <div class="actions">
            <a class="btn" href="#mesa" data-i18n="players.browse"></a>
            <a class="btn btn-ghost" href="/stats" data-i18n="nav.stats"></a>
            <a class="btn btn-ghost" href="/join" data-i18n="nav.join"></a>
          </div>
        </div>
        <div class="players-hero-side" aria-hidden="true">
          <div class="about-inks players-inks">
            <img src="/img/marks/fury.png?v=1" alt="">
            <img src="/img/marks/s4mz.png?v=1" alt="">
            <img src="/img/marks/khastz.png?v=1" alt="">
            <img src="/img/marks/cadu.png?v=1" alt="">
            <img src="/img/marks/bill.png?v=1" alt="">
          </div>
          <p class="players-count" id="count"></p>
        </div>
      </div>
    </section>

    <div class="pulse players-pulse" id="pulse"></div>

    <div class="wrap section players-board" id="list"></div>

    <section class="wrap section about-close">
      <div class="about-close-card">
        <p class="kicker" data-i18n="players.close.kicker"></p>
        <h2 data-i18n="players.close.title"></h2>
        <p data-i18n="players.close.lede"></p>
        <div class="actions">
          <a class="btn" href="/join" data-i18n="nav.join"></a>
          <a class="btn btn-ghost" href="/clips" data-i18n="nav.clips"></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=89"></script>
  <script>
    function render() {
      WTC.api("/api/players")
        .then(({ players }) => {
          const pulse = document.getElementById("pulse");
          const count = document.getElementById("count");
          if (pulse) pulse.innerHTML = WTC.pulseLine(players);
          if (count) {
            count.textContent = WTC.t("players.count").replace("{n}", String(players.length));
          }
          document.getElementById("list").innerHTML = players.length
            ? WTC.playersPage(players)
            : WTC.emptyBox("empty.players");
          WTC.motion();
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
