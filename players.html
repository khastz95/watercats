<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elenco · Watercats</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/badge.png?v=39" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=39">
</head>
<body>
  <header class="header" id="header"></header>
  <div class="pulse" id="pulse"></div>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="players.kicker"></p>
        <h2 data-i18n="nav.players"></h2>
        <p data-i18n="players.sub"></p>
      </div>
    </div>
    <div id="list"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=39"></script>
  <script>
    function render() {
      WTC.api("/api/players")
        .then(({ players }) => {
          const pulse = document.getElementById("pulse");
          if (pulse) pulse.innerHTML = WTC.pulseLine(players);
          document.getElementById("list").innerHTML = players.length
            ? WTC.starRoster(players) + `<div class="grid players">${players.map(WTC.playerCard).join("")}</div>`
            : WTC.emptyBox("empty.players");
          WTC.motion();
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
