  <link rel="icon" href="/img/icon.png?v=48" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=48">
  <link rel="canonical" href="https://watercats.vercel.app/players">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/players">
  <meta property="og:title" content="Membros · Watercats!">
  <meta property="og:description" content="Quem faz parte do clube Watercats hoje. Perfis, números e jogadas.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=48">

  <meta property="og:image:height" content="630">

  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=48">
</head>
<body>
  <header class="header" id="header"></header>
  <div class="pulse" id="pulse"></div>
  <main class="wrap section">
    <div class="section-head">
      <div>
        <p class="kicker" data-i18n="players.kicker"></p>
        <h2 data-i18n="nav.players"></h2>
        <p data-i18n="players.sub"></p>
      </div>
    </div>
    <div id="list"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=48"></script>
  <script>
    function render() {
      WTC.api("/api/players")
        .then(({ players }) => {
          const pulse = document.getElementById("pulse");
          if (pulse) pulse.innerHTML = WTC.pulseLine(players);
          document.getElementById("list").innerHTML = players.length
            ? WTC.starRoster(players) + `<div class="grid players">${players.map(WTC.playerCard).join("")}</div>`
            : WTC.emptyBox("empty.players");
          WTC.motion();
        })
        .catch(() => { document.getElementById("list").innerHTML = WTC.errorBox(); });
    }
    render();
    document.addEventListener("wtc:lang", render);
  </script>
</body>
</html>
