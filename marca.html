<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marca · Watercats! - Alliance</title>
  <meta name="description" content="Vitrine da marca Watercats — prévia do que vem. Sem loja ainda.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=71" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=71">
  <link rel="canonical" href="https://watercats.vercel.app/marca">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/marca">
  <meta property="og:title" content="Marca · Watercats!">
  <meta property="og:description" content="Vitrine da marca Watercats — prévia do que vem. Sem loja ainda.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marca · Watercats!">
  <meta name="twitter:description" content="Vitrine da marca Watercats — prévia do que vem. Sem loja ainda.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=107">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="marca-page">
    <section class="wrap marca-hero">
      <div class="marca-hero-grid">
        <aside class="marca-hero-seal">
          <div class="marca-seal-board">
            <span class="sheet-gems" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <div class="seal marca-seal">
              <span class="seal-aura" aria-hidden="true"></span>
              <span class="seal-ring is-wide" aria-hidden="true"></span>
              <span class="seal-ring" aria-hidden="true"></span>
              <span class="seal-gems" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <img src="/img/badge.png?v=71" alt="Logo Watercats" data-logo>
            </div>
            <img class="marca-wordmark" src="/img/wordmark-dark.png?v=71" alt="Watercats" data-wordmark>
            <p class="marca-seal-tag"><em>ALLIANCE</em></p>
            <div class="marca-mini" id="marca-mini" aria-hidden="true"></div>
            <div class="marca-seal-meta">
              <p class="marca-count" id="marca-count"></p>
              <p class="marca-seal-soon" data-i18n="marca.soon"></p>
            </div>
          </div>
        </aside>
        <div class="marca-hero-copy">
          <p class="kicker" data-i18n="marca.kicker"></p>
          <h1 data-i18n="marca.title"></h1>
          <p class="tagline"><span>ALLIANCE</span></p>
          <p class="marca-lede" data-i18n="marca.sub"></p>
          <ul class="about-chips" aria-label="Marca">
            <li data-i18n="marca.chip1"></li>
            <li data-i18n="marca.chip2"></li>
            <li data-i18n="marca.chip3"></li>
          </ul>
          <div class="actions">
            <a class="btn" href="#vitrine" data-i18n="marca.browse"></a>
            <a class="btn btn-ghost" href="#avisos" data-i18n="marca.notify"></a>
            <a class="btn btn-ghost" href="/sobre" data-i18n="nav.about"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="wrap section marca-stage" id="vitrine">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">01</span> <span data-i18n="marca.stage"></span></p>
          <h2 data-i18n="marca.stageTitle"></h2>
          <p data-i18n="marca.stageSub"></p>
        </div>
        <p class="marca-hint" data-i18n="marca.hint"></p>
      </div>

      <div class="marca-toolbar">
        <p class="marca-toolbar-lab" data-i18n="marca.film"></p>
        <div class="marca-film" id="marca-film" tabindex="0"></div>
      </div>

      <div class="marca-wall" id="marca-wall"></div>
    </section>

    <section class="wrap section marca-wait" id="avisos">
      <div class="marca-wait-card">
        <div class="marca-wait-copy">
          <p class="kicker"><span class="about-step">02</span> <span data-i18n="marca.wait.kicker"></span></p>
          <h2 data-i18n="marca.wait.title"></h2>
          <p data-i18n="marca.wait.lede"></p>
        </div>
        <form class="marca-form" id="marca-form" novalidate>
          <div class="marca-form-row">
            <label class="sr-only" for="marca-email" data-i18n="marca.wait.email"></label>
            <input id="marca-email" name="email" type="email" required autocomplete="email" maxlength="120" data-i18n-placeholder="marca.wait.emailPh">
            <input id="marca-name" name="name" type="text" autocomplete="name" maxlength="80" class="sr-only" tabindex="-1" aria-hidden="true">
            <input type="text" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
            <button class="btn" type="submit" data-i18n="marca.wait.submit"></button>
          </div>
          <p class="marca-form-note" data-i18n="marca.wait.note"></p>
          <p class="msg" id="marca-msg" role="status"></p>
        </form>
        <div class="marca-done" id="marca-done" hidden>
          <p class="kicker" data-i18n="marca.wait.okTitle"></p>
          <h3 data-i18n="marca.wait.ok"></h3>
          <button class="btn btn-ghost" type="button" id="marca-again" data-i18n="marca.wait.again"></button>
        </div>
      </div>
    </section>

    <section class="wrap section about-close">
      <div class="about-close-card">
        <p class="kicker" data-i18n="marca.close.kicker"></p>
        <h2 data-i18n="marca.close.title"></h2>
        <p data-i18n="marca.close.lede"></p>
        <div class="actions">
          <a class="btn" href="/sobre" data-i18n="nav.about"></a>
          <a class="btn btn-ghost" href="/join" data-i18n="nav.join"></a>
        </div>
      </div>
    </section>
  </main>

  <div class="marca-lightbox" id="marca-lightbox" hidden>
    <button type="button" class="marca-lb-close" data-lb-close aria-label="Fechar">×</button>
    <button type="button" class="marca-lb-nav is-prev" data-lb-prev aria-label="Anterior">‹</button>
    <figure class="marca-lb-stage">
      <div class="marca-lb-frame">
        <span class="sheet-gems" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <img id="marca-lb-img" src="" alt="">
      </div>
      <figcaption>
        <span id="marca-lb-index"></span>
        <strong id="marca-lb-name"></strong>
        <em data-i18n="marca.soon"></em>
      </figcaption>
    </figure>
    <button type="button" class="marca-lb-nav is-next" data-lb-next aria-label="Próxima">›</button>
  </div>

  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=107"></script>
  <script>
    const PRODUCTS = [
      { id: "jaqueta", img: "/img/marca/jaqueta.png?v=1", nameKey: "marca.item.jacket" },
      { id: "bone", img: "/img/marca/bone.png?v=1", nameKey: "marca.item.cap" },
      { id: "pins", img: "/img/marca/pins.png?v=1", nameKey: "marca.item.pins" },
      { id: "blusa", img: "/img/marca/blusa-camisa.png?v=1", nameKey: "marca.item.hoodie" },
      { id: "camisa-team", img: "/img/marca/camisa-team.png?v=1", nameKey: "marca.item.jersey" },
      { id: "bag", img: "/img/marca/bag.png?v=1", nameKey: "marca.item.bag" },
      { id: "mousepad", img: "/img/marca/mousepad.png?v=1", nameKey: "marca.item.pad" },
      { id: "copos", img: "/img/marca/copos.png?v=1", nameKey: "marca.item.cups" }
    ];

    let active = 0;
    const film = document.getElementById("marca-film");
    const wall = document.getElementById("marca-wall");
    const countEl = document.getElementById("marca-count");
    const miniEl = document.getElementById("marca-mini");
    const lb = document.getElementById("marca-lightbox");
    const lbImg = document.getElementById("marca-lb-img");
    const lbName = document.getElementById("marca-lb-name");
    const lbIndex = document.getElementById("marca-lb-index");

    function paint() {
      if (countEl) {
        countEl.textContent = WTC.t("marca.count").replace("{n}", String(PRODUCTS.length));
      }
      if (miniEl) {
        miniEl.innerHTML = PRODUCTS.slice(0, 4).map((p, i) => `
          <button type="button" class="marca-mini-item" data-i="${i}" aria-label="${WTC.escapeAttr(WTC.t(p.nameKey))}">
            <img src="${p.img}" alt="" loading="lazy" decoding="async">
          </button>
        `).join("");
      }

      film.innerHTML = PRODUCTS.map((p, i) => `
        <button type="button" class="marca-thumb${i === 0 ? " is-on" : ""}" data-i="${i}" aria-label="${WTC.escapeAttr(WTC.t(p.nameKey))}">
          <img src="${p.img}" alt="" loading="lazy" decoding="async">
        </button>
      `).join("");

      wall.innerHTML = PRODUCTS.map((p, i) => `
        <button type="button" class="marca-pane reveal" data-i="${i}" style="--d:${(i * 0.05).toFixed(2)}s">
          <span class="sheet-gems" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sheet-no">${String(i + 1).padStart(2, "0")}</span>
          <img src="${p.img}" alt="${WTC.escapeAttr(WTC.t(p.nameKey))}" loading="${i < 2 ? "eager" : "lazy"}" decoding="async">
          <span class="marca-pane-meta">
            <em data-i18n="marca.soon"></em>
            <strong>${WTC.escapeHtml(WTC.t(p.nameKey))}</strong>
          </span>
        </button>
      `).join("");

      wall.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = WTC.t(el.getAttribute("data-i18n"));
      });
      WTC.motion();
    }

    function openAt(i) {
      active = (i + PRODUCTS.length) % PRODUCTS.length;
      const p = PRODUCTS[active];
      lb.hidden = false;
      document.body.classList.add("marca-lb-open");
      lbImg.src = p.img;
      lbImg.alt = WTC.t(p.nameKey);
      lbName.textContent = WTC.t(p.nameKey);
      lbIndex.textContent = `${String(active + 1).padStart(2, "0")} / ${String(PRODUCTS.length).padStart(2, "0")}`;
      lb.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = WTC.t(el.getAttribute("data-i18n"));
      });
      film.querySelectorAll(".marca-thumb").forEach((el, idx) => el.classList.toggle("is-on", idx === active));
    }

    function closeLb() {
      lb.hidden = true;
      document.body.classList.remove("marca-lb-open");
      lbImg.removeAttribute("src");
    }

    function fillPlaceholders() {
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = WTC.t(el.getAttribute("data-i18n-placeholder"));
      });
    }

    paint();
    fillPlaceholders();
    document.addEventListener("wtc:lang", () => {
      paint();
      fillPlaceholders();
      if (!lb.hidden) openAt(active);
    });

    film.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-i]");
      if (!btn) return;
      const i = Number(btn.dataset.i);
      document.querySelector(`.marca-pane[data-i="${i}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      openAt(i);
    });

    miniEl?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-i]");
      if (!btn) return;
      const i = Number(btn.dataset.i);
      document.querySelector(`.marca-pane[data-i="${i}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      openAt(i);
    });

    wall.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-i]");
      if (!btn) return;
      openAt(Number(btn.dataset.i));
    });

    lb.querySelector("[data-lb-close]")?.addEventListener("click", closeLb);
    lb.querySelector("[data-lb-prev]")?.addEventListener("click", () => openAt(active - 1));
    lb.querySelector("[data-lb-next]")?.addEventListener("click", () => openAt(active + 1));
    lb.addEventListener("click", (e) => {
      if (e.target === lb) closeLb();
    });

    document.addEventListener("keydown", (e) => {
      if (lb.hidden) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowLeft") openAt(active - 1);
      if (e.key === "ArrowRight") openAt(active + 1);
    });

    const form = document.getElementById("marca-form");
    const done = document.getElementById("marca-done");
    const msg = document.getElementById("marca-msg");

    document.getElementById("marca-again")?.addEventListener("click", () => {
      done.hidden = true;
      form.hidden = false;
      msg.textContent = "";
      form.email?.focus();
    });

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";
      const data = Object.fromEntries(new FormData(form).entries());
      const email = String(data.email || "").trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = WTC.t("marca.wait.needEmail");
        form.email.focus();
        return;
      }
      const btn = form.querySelector('[type="submit"]');
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = WTC.t("marca.wait.sending");
      try {
        await WTC.api("/api/marca", { method: "POST", body: data });
        form.reset();
        form.hidden = true;
        done.hidden = false;
        msg.textContent = "";
      } catch (err) {
        msg.textContent = err.message || WTC.t("marca.wait.fail");
      } finally {
        btn.disabled = false;
        btn.textContent = prev || WTC.t("marca.wait.submit");
      }
    });
  </script>
</body>
</html>
