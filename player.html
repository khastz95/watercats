<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogador · WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/logo.png?v=9" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=10">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap" id="main"></main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=9"></script>
  <script>
    const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const root = document.getElementById("main");
    let player = null;

    function draw() {
      if (!player) return;
      const p = player;
      const s = p.stats || {};
      const photo = p.photo
        ? `<img class="photo" src="${p.photo}" alt="${p.name}">`
        : `<div class="photo"></div>`;
      const links = [
        p.steamUrl && `<a class="btn btn-ghost" href="${p.steamUrl}" target="_blank" rel="noreferrer">Steam</a>`,
        p.faceitUrl && `<a class="btn btn-ghost" href="${p.faceitUrl}" target="_blank" rel="noreferrer">FACEIT</a>`,
        p.twitchUrl && `<a class="btn btn-ghost" href="${p.twitchUrl}" target="_blank" rel="noreferrer">Twitch</a>`
      ].filter(Boolean).join("");
      root.innerHTML = `
        <section class="profile">
          <aside class="profile-side">${photo}</aside>
          <div>
            <p class="kicker">${WTC.statusLabel(p.status)}${p.role ? " · " + p.role : ""}</p>
            <h1>${p.name}</h1>
            <p class="meta">${[p.realName, p.city, p.country].filter(Boolean).join(" · ")}</p>
            <p class="bio">${p.bio || WTC.t("profile.emptyBio")}</p>
            <div class="links">${links}</div>
            <div class="grid stats-grid">
              <div class="card stat"><b>${WTC.dash(s.rating, 2)}</b><span>${WTC.t("th.rating")}</span></div>
              <div class="card stat"><b>${WTC.dash(s.kd, 2)}</b><span>${WTC.t("th.kd")}</span></div>
              <div class="card stat"><b>${WTC.dash(s.adr, 1)}</b><span>${WTC.t("th.adr")}</span></div>
              <div class="card stat"><b>${WTC.dash(s.hsPercent, 1)}</b><span>${WTC.t("th.hs")}</span></div>
              <div class="card stat"><b>${WTC.dash(s.mapsPlayed)}</b><span>${WTC.t("th.maps")}</span></div>
              <div class="card stat"><b>${WTC.dash(s.mvp)}</b><span>MVP</span></div>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="section-head"><h2>${WTC.t("profile.plays")}</h2></div>
          <div class="grid clips">${(p.clips || []).length ? p.clips.map(WTC.clipCard).join("") : WTC.emptyBox("empty.clips")}</div>
        </section>`;
    }

    WTC.api("/api/players?id=" + encodeURIComponent(slug))
      .then(({ player: p }) => {
        player = p;
        document.title = p.name + " · WATERCATS";
        draw();
      })
      .catch(() => { root.innerHTML = `<div class="section">${WTC.emptyBox("empty.players")}</div>`; });
    document.addEventListener("wtc:lang", draw);
  </script>
</body>
</html>
