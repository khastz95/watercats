<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogador · WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=13" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=13">
</head>
<body>
  <header class="header" id="header"></header>
  <main class="wrap" id="main"></main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=13"></script>
  <script>
    const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const root = document.getElementById("main");
    let player = null;

    const esc = (v) => WTC.escapeHtml(v);

    function infoRow(key, value) {
      if (!value) return "";
      return `<div><dt>${WTC.t(key)}</dt><dd>${esc(value)}</dd></div>`;
    }

    function statCard(label, text) {
      return `<div class="card stat">
        <b>${text}</b>
        <span>${WTC.t(label)}</span>
      </div>`;
    }

    function draw() {
      if (!player) return;
      const p = player;
      const s = WTC.stats(p);
      const lf = p.leetify;
      const links = [
        p.steamUrl && `<a class="btn btn-ghost" href="${p.steamUrl}" target="_blank" rel="noreferrer">Steam</a>`,
        p.faceitUrl && `<a class="btn btn-ghost" href="${p.faceitUrl}" target="_blank" rel="noreferrer">FACEIT</a>`,
        p.twitchUrl && `<a class="btn btn-ghost" href="${p.twitchUrl}" target="_blank" rel="noreferrer">Twitch</a>`
      ].filter(Boolean).join("");
      const info = [
        infoRow("info.realName", p.realName),
        infoRow("info.role", p.role),
        infoRow("info.from", WTC.place(p)),
        infoRow("info.since", p.startedPlaying),
        infoRow("info.joined", p.joinedAt),
        infoRow("lf.since", lf && lf.firstMatch ? new Date(lf.firstMatch).toLocaleDateString() : ""),
        infoRow("info.steamId", p.steamId)
      ].filter(Boolean).join("");
      const synced = lf && lf.syncedAt
        ? `<p class="source">${WTC.t("lf.sub")} ${WTC.t("lf.synced")} ${new Date(lf.syncedAt).toLocaleDateString()}.</p>`
        : `<p class="source">${WTC.t("lf.empty")}</p>`;

      root.innerHTML = `
        <section class="profile">
          <aside class="profile-side">
            ${WTC.playerPhoto(p)}
            <span class="chip chip-${p.status || "active"}">${esc(WTC.statusLabel(p.status))}</span>
            ${info ? `<dl class="info-list">${info}</dl>` : ""}
          </aside>
          <div class="profile-main">
            <p class="kicker">${esc(p.role || WTC.place(p) || "WATERCATS")}</p>
            <h1>${esc(p.name)}</h1>
            <p class="bio">${esc(p.bio) || WTC.t("profile.emptyBio")}</p>
            ${links ? `<div class="links">${links}</div>` : ""}
            ${lf && lf.form && lf.form.length ? `
              <div class="form-block">
                <p class="kicker">${WTC.t("lf.form")}</p>
                ${WTC.formBadges(p)}
              </div>` : ""}
          </div>
        </section>

        <section class="section">
          <div class="section-head"><div><h2>${WTC.t("profile.numbers")}</h2></div></div>
          <div class="grid stats-grid">
            ${statCard("lf.rating", WTC.dash(s.rating, 2))}
            ${statCard("lf.premier", WTC.dash(s.premier))}
            ${statCard("lf.winrate", WTC.pct(s.winrate))}
            ${statCard("lf.matches", WTC.dash(s.matches))}
            ${statCard("lf.aim", WTC.dash(s.aim, 1))}
            ${statCard("lf.positioning", WTC.dash(s.positioning, 1))}
            ${statCard("lf.utility", WTC.dash(s.utility, 1))}
            ${statCard("lf.hs", s.hsAccuracy == null ? "—" : WTC.dash(s.hsAccuracy, 1) + "%")}
            ${statCard("lf.spray", s.sprayAccuracy == null ? "—" : WTC.dash(s.sprayAccuracy, 1) + "%")}
            ${statCard("lf.preaim", WTC.dash(s.preaim, 2))}
            ${statCard("lf.reaction", s.reactionMs == null ? "—" : WTC.dash(s.reactionMs) + " ms")}
            ${statCard("th.kd", WTC.dash(s.kd, 2))}
          </div>
          ${synced}
        </section>

        <section class="section">
          <div class="section-head"><h2>${WTC.t("profile.plays")}</h2></div>
          <div class="grid clips">${(p.clips || []).length ? p.clips.map(WTC.clipCard).join("") : WTC.emptyBox("empty.clips")}</div>
        </section>`;
    }

    WTC.api("/api/players?id=" + encodeURIComponent(slug))
      .then(({ player: p }) => {
        player = p;
        document.title = p.name + " · WATERCATS";
        draw();
      })
      .catch(() => { root.innerHTML = `<div class="section">${WTC.emptyBox("empty.players")}</div>`; });
    document.addEventListener("wtc:lang", draw);
  </script>
</body>
</html>
