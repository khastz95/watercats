<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogador · Watercats! - Alliance</title>
  <meta name="description" content="Perfil de um membro do clube Watercats.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon.png?v=71" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=71">
  <link rel="canonical" href="https://watercats.vercel.app/jogador">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watercats!">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://watercats.vercel.app/jogador">
  <meta property="og:title" content="Membro · Watercats!">
  <meta property="og:description" content="Perfil de um membro do clube Watercats.">
  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Watercats!">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Membro · Watercats!">
  <meta name="twitter:description" content="Perfil de um membro do clube Watercats.">
  <meta name="twitter:image" content="https://watercats.vercel.app/img/og.png?v=71">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=99">
</head>
<body class="is-player">
  <header class="header" id="header"></header>
  <main class="player-page" id="main"></main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=99"></script>
  <script>
    const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const root = document.getElementById("main");
    let player = null;
    let roster = [];
    let shownClips = 12;
    let shownMatches = 6;

    const esc = (v) => WTC.escapeHtml(v);

    function infoRow(key, value) {
      if (!value) return "";
      return `<div><dt>${WTC.t(key)}</dt><dd>${esc(value)}</dd></div>`;
    }

    function privacyLabel(mode) {
      if (!mode) return "";
      const key = "lf.privacy." + mode;
      const label = WTC.t(key);
      return label === key ? mode : label;
    }

    function numbersEmpty(p) {
      const synced = p.leetify && p.leetify.syncedAt
        ? `<p class="source">${WTC.t("lf.sub")} ${WTC.t("lf.synced")} ${new Date(p.leetify.syncedAt).toLocaleDateString()}.</p>`
        : `<p class="source">${WTC.t("lf.empty")}</p>`;
      return `<section class="wrap section lf-sheet player-numbers" id="numeros">
        <div class="section-head about-section-head">
          <div>
            <p class="kicker"><span class="about-step">01</span> <span>${esc(WTC.t("profile.numbersKicker"))}</span></p>
            <h2>${esc(WTC.t("profile.numbers"))}</h2>
            <p>${esc(WTC.t("profile.numbersSub"))}</p>
          </div>
          ${WTC.leetifySyncBtn(p.id)}
        </div>
        <div class="player-panel">${synced}</div>
      </section>`;
    }

    function draw() {
      if (!player) return;
      const p = player;
      const lf = p.leetify;
      const idn = WTC.identity(p);
      const info = [
        infoRow("info.realName", idn.realName || p.realName),
        infoRow("info.role", idn.role || p.role),
        infoRow("info.from", idn.place || WTC.place(p)),
        infoRow("info.since", p.startedPlaying),
        infoRow("info.joined", p.joinedAt),
        infoRow("lf.leetifyName", lf && lf.name),
        infoRow("lf.privacy", privacyLabel(lf && lf.privacy)),
        infoRow("lf.since", lf && lf.firstMatch ? new Date(lf.firstMatch).toLocaleDateString() : "")
      ].filter(Boolean).join("");

      WTC.tintMark(WTC.markOf(p), WTC.cardInk(p));
      root.style.setProperty("--player", WTC.cardInk(p));
      const clips = p.clips || [];
      const playsCount = WTC.t("profile.playsCount").replace("{n}", String(clips.length));
      root.innerHTML = `
        ${WTC.profileHero(p, { info })}

        ${lf ? WTC.leetifyDossier(p, roster, { shown: shownMatches, step: "01" }) : numbersEmpty(p)}

        <section class="wrap section player-plays" id="jogadas">
          <div class="section-head about-section-head">
            <div>
              <p class="kicker"><span class="about-step">02</span> <span>${esc(WTC.t("profile.playsKicker"))}</span></p>
              <h2>${esc(WTC.t("profile.playsTitle"))}</h2>
              <p>${esc(WTC.t("profile.playsSub"))}</p>
            </div>
            <p class="player-count">${esc(playsCount)}</p>
          </div>
          <div class="player-panel">
            <div class="grid clips">${clips.length ? WTC.clipPager(clips, shownClips) : WTC.emptyBox("empty.clips")}</div>
          </div>
        </section>

        ${roster.length ? `<section class="wrap section star-section player-crew">
          <div class="section-head about-section-head">
            <div>
              <p class="kicker"><span class="about-step">03</span> <span>${esc(WTC.t("profile.crewKicker"))}</span></p>
              <h2>${esc(WTC.t("profile.crewTitle"))}</h2>
              <p>${esc(WTC.t("profile.crewSub"))}</p>
            </div>
            <a class="btn btn-ghost" href="/players">${esc(WTC.t("profile.back"))}</a>
          </div>
          <div class="player-panel players-table-shell">
            ${WTC.starRoster(roster, { currentId: p.id, compact: true })}
          </div>
        </section>` : ""}

        <section class="wrap section about-close">
          <div class="about-close-card">
            <p class="kicker">${esc(WTC.t("profile.close.kicker"))}</p>
            <h2>${esc(WTC.t("profile.close.title"))}</h2>
            <p>${esc(WTC.t("profile.close.lede"))}</p>
            <div class="actions">
              <a class="btn" href="/players">${esc(WTC.t("cta.players"))}</a>
              <a class="btn btn-ghost" href="/stats">${esc(WTC.t("nav.stats"))}</a>
              <a class="btn btn-ghost" href="/clips">${esc(WTC.t("nav.clips"))}</a>
            </div>
          </div>
        </section>`;
      if (window.WTC.motion) WTC.motion();
    }

    Promise.all([
      WTC.api("/api/players?id=" + encodeURIComponent(slug)),
      WTC.api("/api/players").catch(() => ({ players: [] }))
    ])
      .then(([{ player: p }, { players }]) => {
        player = p;
        roster = players || [];
        document.title = WTC.displayName(p) + " · Watercats! - Alliance";
        draw();
      })
      .catch(() => { root.innerHTML = `<div class="wrap section">${WTC.emptyBox("empty.players")}</div>`; });
    document.addEventListener("wtc:lang", draw);
    root.addEventListener("click", async (e) => {
      const sync = e.target.closest("[data-leetify-sync]");
      if (sync) {
        if (sync.disabled) return;
        const id = sync.getAttribute("data-leetify-sync");
        const y = window.scrollY;
        sync.disabled = true;
        sync.textContent = WTC.t("lf.syncing");
        try {
          const data = await WTC.api("/api/leetify", { method: "POST", body: { id } });
          const row = (data.results || [])[0] || {};
          if (row.ok === false) throw new Error(row.error || "Erro");
          if (data.skipped || row.skipped) {
            sync.textContent = WTC.t("lf.syncWait");
            setTimeout(() => {
              sync.disabled = false;
              sync.textContent = WTC.t("lf.sync");
            }, 1800);
            return;
          }
          const fresh = await WTC.api("/api/players?id=" + encodeURIComponent(id));
          player = fresh.player;
          draw();
          window.scrollTo(0, y);
        } catch (err) {
          sync.disabled = false;
          sync.textContent = err.message || WTC.t("lf.sync");
        }
        return;
      }
      const moreMatches = e.target.closest("[data-match-more]");
      const moreClips = e.target.closest("[data-clip-more]");
      if (!moreMatches && !moreClips) return;
      const y = window.scrollY;
      if (moreMatches) shownMatches += 6;
      if (moreClips) shownClips += 12;
      draw();
      window.scrollTo(0, y);
    });
  </script>
</body>
</html>
