  <meta property="og:image" content="https://watercats.vercel.app/img/og.png?v=71">

<body>
  <a class="skip" href="#main" data-i18n="skip">Pular para o conteúdo</a>
  <header class="header" id="header"></header>
  <main id="main" class="home-page">
    <section class="wrap hero">
      <div class="hero-logo">
        <div class="seal">
          <span class="seal-aura" aria-hidden="true"></span>
          <span class="seal-ring is-wide" aria-hidden="true"></span>
          <span class="seal-ring" aria-hidden="true"></span>
          <span class="seal-gems" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <img src="/img/badge.png?v=71" alt="Logo Watercats" data-logo>
        </div>
      </div>
      <div class="hero-copy">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 class="hero-word">
          <img class="mark-dark" src="/img/wordmark-dark.png?v=53" alt="Watercats">
        </h1>
        <p class="tagline"><span>ALLIANCE</span></p>
        <p class="lede" data-i18n="hero.lede"></p>
        <ul class="about-chips hero-chips" aria-label="Watercats">
          <li data-i18n="hero.note.cs"></li>
          <li data-i18n="hero.note.friends"></li>
          <li data-i18n="hero.note.tag"></li>
        </ul>
        <div class="actions">
          <a class="btn" href="/players" data-i18n="cta.players"></a>
          <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
          <a class="btn btn-ghost" href="/join" data-i18n="nav.join"></a>
        </div>
      </div>
    </section>

    <div class="pulse home-pulse" id="pulse"></div>

    <section class="wrap home-facts-block">
      <div class="facts home-facts" id="facts"></div>
    </section>

    <section class="wrap section home-block">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">01</span> <span data-i18n="home.story.kicker"></span></p>
          <h2 data-i18n="home.story.title"></h2>
          <p data-i18n="home.story.lead"></p>
        </div>
        <a class="btn btn-ghost" href="/sobre" data-i18n="cta.about"></a>
      </div>
      <div class="story-grid">
        <article class="story-card">
          <span class="story-no">01</span>
          <h3 data-i18n="home.story.1.t"></h3>
          <p data-i18n="home.story.1"></p>
        </article>
        <article class="story-card">
          <span class="story-no">02</span>
          <h3 data-i18n="home.story.2.t"></h3>
          <p data-i18n="home.story.2"></p>
        </article>
        <article class="story-card">
          <span class="story-no">03</span>
          <h3 data-i18n="home.story.3.t"></h3>
          <p data-i18n="home.story.3"></p>
        </article>
      </div>
    </section>

    <section class="wrap section home-block">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">02</span> <span data-i18n="home.kicker"></span></p>
          <h2 data-i18n="home.roster"></h2>
          <p data-i18n="home.roster.sub"></p>
        </div>
        <a class="btn btn-ghost" href="/players" data-i18n="cta.players"></a>
      </div>
      <p class="house-strip" data-i18n="home.strip"></p>
      <div class="players-table-shell home-table-shell">
        <div id="roster"></div>
      </div>
    </section>

    <section class="wrap section home-block">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">03</span> <span data-i18n="home.now"></span></p>
          <h2 data-i18n="home.hot"></h2>
          <p data-i18n="home.hot.sub"></p>
        </div>
      </div>
      <div id="hot" class="hot-grid"></div>
    </section>

    <section class="wrap section home-block">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">04</span> <span data-i18n="home.stats"></span></p>
          <h2 data-i18n="home.statsTitle"></h2>
          <p data-i18n="home.stats.sub"></p>
        </div>
        <a class="btn btn-ghost" href="/stats" data-i18n="nav.stats"></a>
      </div>
      <div id="stats" class="grid stats-grid home-stats"></div>
    </section>

    <section class="wrap section home-block">
      <div class="section-head about-section-head">
        <div>
          <p class="kicker"><span class="about-step">05</span> <span data-i18n="home.clips"></span></p>
          <h2 data-i18n="home.clipsTitle"></h2>
          <p data-i18n="home.clips.sub"></p>
        </div>
        <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
      </div>
      <div class="home-clips-shell" id="clips"></div>
    </section>

    <section class="wrap section about-close">
      <div class="about-close-card">
        <p class="kicker" data-i18n="home.close.kicker"></p>
        <h2 data-i18n="home.close.title"></h2>
        <p data-i18n="home.close.lede"></p>
        <div class="actions">
          <a class="btn" href="/join" data-i18n="nav.join"></a>
          <a class="btn btn-ghost" href="/sobre" data-i18n="cta.about"></a>
          <a class="btn btn-ghost" href="/players" data-i18n="cta.players"></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=90"></script>
  <script>
    async function boot() {
      const roster = document.getElementById("roster");
      const stats = document.getElementById("stats");
      const clips = document.getElementById("clips");
      try {
        const [{ players }, { clips: allClips }] = await Promise.all([
          WTC.api("/api/players"),
          WTC.api("/api/clips")
        ]);
        roster.innerHTML = players.length
          ? WTC.starRoster(players)
          : WTC.emptyBox("empty.players");

        const pulse = document.getElementById("pulse");
        const facts = document.getElementById("facts");
        const hot = document.getElementById("hot");
        if (pulse) pulse.innerHTML = WTC.pulseLine(players);
        if (facts) facts.innerHTML = WTC.factStrip(players, allClips);

        const showClips = WTC.pickHomeClips(allClips, 12);
        const hotPlayers = players
          .map((p) => ({ p, s: WTC.stats(p) }))
          .sort((a, b) => (b.s.rating ?? -Infinity) - (a.s.rating ?? -Infinity))
          .slice(0, 3);

        if (hot) {
          hot.innerHTML = hotPlayers.length
            ? hotPlayers.map((row, i) => WTC.spotCard(row.p, i + 1)).join("")
            : "";
        }

        stats.innerHTML = WTC.houseCards(players, allClips);
        clips.innerHTML = showClips.length
          ? WTC.clipReel(showClips)
          : WTC.emptyBox("empty.clips");
        WTC.motion();
      } catch {
        roster.innerHTML = WTC.errorBox();
        stats.innerHTML = "";
        clips.innerHTML = "";
      }
    }
    boot();
    document.addEventListener("wtc:lang", boot);
  </script>
</body>
</html>
