<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WATERCATS</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("wtc_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
  <link rel="icon" href="/img/icon-dark.png?v=19" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=19">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Pular para o conteúdo</a>
  <header class="header" id="header"></header>
  <main id="main">
    <section class="wrap hero">
      <div class="hero-logo">
        <img src="/img/logo-dark.png?v=19" alt="Logo WATERCATS" data-logo>
      </div>
      <div class="hero-copy">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1>WATER<span>CATS</span></h1>
        <p class="tagline" data-i18n="hero.tagline"></p>
        <p class="lede" data-i18n="hero.lede"></p>
        <div class="actions">
          <a class="btn" href="/players" data-i18n="cta.players"></a>
          <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
        </div>
      </div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="home.kicker"></p>
          <h2 data-i18n="home.roster"></h2>
        </div>
        <a href="/players" data-i18n="cta.players"></a>
      </div>
      <div id="roster"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.stats"></h2>
        </div>
        <a href="/stats" data-i18n="nav.stats"></a>
      </div>
      <div id="stats" class="grid stats-grid"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.clips"></h2>
        </div>
        <a href="/clips" data-i18n="cta.clips"></a>
      </div>
      <div id="clips" class="grid clips"></div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=19"></script>
  <script>
    async function boot() {
      const roster = document.getElementById("roster");
      const stats = document.getElementById("stats");
      const clips = document.getElementById("clips");
      try {
        const [{ players }, { clips: allClips }] = await Promise.all([
          WTC.api("/api/players"),
          WTC.api("/api/clips")
        ]);
        roster.innerHTML = players.length
          ? WTC.starRoster(players)
          : WTC.emptyBox("empty.players");

        const all = players.map(WTC.stats);
        const ratings = all.map((s) => s.rating).filter((v) => v != null);
        const topRating = ratings.length ? Math.max(...ratings) : null;
        const maps = all.reduce((n, s) => n + (s.matches || 0), 0);
        const featured = allClips.filter((c) => c.featured);
        const showClips = (featured.length ? featured : allClips).slice(0, 3);

        stats.innerHTML = `
          <div class="card stat"><b>${players.length}</b><span>${WTC.t("stat.players")}</span></div>
          <div class="card stat"><b>${WTC.dash(topRating, 2)}</b><span>${WTC.t("stat.rating")}</span></div>
          <div class="card stat"><b>${WTC.dash(maps)}</b><span>${WTC.t("stat.maps")}</span></div>
          <div class="card stat"><b>${allClips.length}</b><span>${WTC.t("stat.clips")}</span></div>
        `;
        clips.innerHTML = showClips.length ? showClips.map(WTC.clipCard).join("") : WTC.emptyBox("empty.clips");
      } catch {
        roster.innerHTML = WTC.errorBox();
        stats.innerHTML = "";
        clips.innerHTML = "";
      }
    }
    boot();
    document.addEventListener("wtc:lang", boot);
  </script>
</body>
</html>
