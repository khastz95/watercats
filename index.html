  <meta property="og:description" content="Watercats é um clube de amigos. CS2, o mesmo nome de sempre. Membros, jogadas e a temporada.">

<body>
  <a class="skip" href="#main" data-i18n="skip">Pular para o conteúdo</a>
  <header class="header" id="header"></header>
  <main id="main">
    <section class="wrap hero">
      <div class="hero-logo">
        <span class="hero-orbit" aria-hidden="true"></span>
        <span class="hero-orbit is-slow" aria-hidden="true"></span>
        <img src="/img/badge.png?v=49" alt="Logo Watercats" data-logo>
      </div>
      <div class="hero-copy">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 class="hero-word">
          <img class="mark-dark" src="/img/wordmark-dark.png?v=49" alt="Watercats">
          <img class="mark-light" src="/img/wordmark-light.png?v=49" alt="">
        </h1>
        <p class="tagline">OLD FRIENDS. <span>SAME GAMES.</span></p>
        <p class="lede" data-i18n="hero.lede"></p>
        <p class="lede" data-i18n="hero.body"></p>
        <div class="hero-notes">
          <span data-i18n="hero.note.cs"></span>
          <span data-i18n="hero.note.friends"></span>
          <span data-i18n="hero.note.tag"></span>
        </div>
        <div class="actions">
          <a class="btn" href="/players" data-i18n="cta.players"></a>
          <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
          <a class="btn btn-ghost" href="/sobre" data-i18n="cta.about"></a>
        </div>
      </div>
    </section>

    <div class="pulse" id="pulse"></div>

    <section class="wrap">
      <div class="facts" id="facts"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="home.story.kicker"></p>
          <h2 data-i18n="home.story.title"></h2>
          <p data-i18n="home.story.lead"></p>
        </div>
        <a href="/sobre" data-i18n="cta.about"></a>
      </div>
      <div class="story-grid">
        <article class="story-card">
          <h3 data-i18n="home.story.1.t"></h3>
          <p data-i18n="home.story.1"></p>
        </article>
        <article class="story-card">
          <h3 data-i18n="home.story.2.t"></h3>
          <p data-i18n="home.story.2"></p>
        </article>
        <article class="story-card">
          <h3 data-i18n="home.story.3.t"></h3>
          <p data-i18n="home.story.3"></p>
        </article>
      </div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="home.kicker"></p>
          <h2 data-i18n="home.roster"></h2>
          <p data-i18n="home.roster.sub"></p>
        </div>
        <a href="/players" data-i18n="cta.players"></a>
      </div>
      <p class="house-strip" data-i18n="home.strip"></p>
      <div id="roster"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="home.now"></p>
          <h2 data-i18n="home.hot"></h2>
          <p data-i18n="home.hot.sub"></p>
        </div>
      </div>
      <div id="hot" class="hot-grid"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.stats"></h2>
          <p data-i18n="home.stats.sub"></p>
        </div>
        <a href="/stats" data-i18n="nav.stats"></a>
      </div>
      <div id="stats" class="grid stats-grid home-stats"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.clips"></h2>
          <p data-i18n="home.clips.sub"></p>
        </div>
        <a href="/clips" data-i18n="cta.clips"></a>
      </div>
      <div id="clips"></div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <div>
          <p class="kicker" data-i18n="home.place.kicker"></p>
          <h2 data-i18n="home.place.title"></h2>
        </div>
      </div>
      <div class="place-box">
        <p data-i18n="home.place.body"></p>
        <div class="actions">
          <a class="btn" href="/players" data-i18n="cta.players"></a>
          <a class="btn btn-ghost" href="/clips" data-i18n="cta.clips"></a>
          <a class="btn btn-ghost" href="/sobre" data-i18n="cta.about"></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
  <script src="/js/site.js?v=49"></script>
  <script>
    async function boot() {
      const roster = document.getElementById("roster");
      const stats = document.getElementById("stats");
      const clips = document.getElementById("clips");
      try {
        const [{ players }, { clips: allClips }] = await Promise.all([
          WTC.api("/api/players"),
          WTC.api("/api/clips")
        ]);
        roster.innerHTML = players.length
          ? WTC.starRoster(players)
          : WTC.emptyBox("empty.players");

        const pulse = document.getElementById("pulse");
        const facts = document.getElementById("facts");
        const hot = document.getElementById("hot");
        if (pulse) pulse.innerHTML = WTC.pulseLine(players);
        if (facts) facts.innerHTML = WTC.factStrip(players, allClips);

        const showClips = WTC.pickHomeClips(allClips, 12);
        const hotPlayers = players
          .map((p) => ({ p, s: WTC.stats(p) }))
          .sort((a, b) => (b.s.rating ?? -Infinity) - (a.s.rating ?? -Infinity))
          .slice(0, 3);

        if (hot) {
          hot.innerHTML = hotPlayers.length
            ? hotPlayers.map((row, i) => WTC.spotCard(row.p, i + 1)).join("")
            : "";
        }

        stats.innerHTML = WTC.houseCards(players, allClips);
        clips.innerHTML = showClips.length
          ? WTC.clipReel(showClips)
          : WTC.emptyBox("empty.clips");
        WTC.motion();
      } catch {
        roster.innerHTML = WTC.errorBox();
        stats.innerHTML = "";
        clips.innerHTML = "";
      }
    }
    boot();
    document.addEventListener("wtc:lang", boot);
  </script>
</body>
</html>
